name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    concurrency:
      group: codeql-go-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/src/go.mod

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          build-mode: manual

      # The Go module does not compile from a fresh checkout without the
      # gitignored generated file src/config/metadata_constants.go, which is
      # produced by the mise metadata task. Generate it first.
      - name: Generate metadata constants
        working-directory: backend
        run: mise run metadata --version=0.0.0

      # Run the traced build from within the Go module root so the CodeQL
      # extractor can resolve source paths correctly (CGO_ENABLED=0
      # matches the release builds).
      - name: Build (traced by CodeQL)
        working-directory: backend/src
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go"

  check-frontend-typescript:
    name: Check Frontend TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: codeql-fe-ts-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true

      - name: Prepare frontend
        run: mise run //frontend:prepare

      - name: Type check
        run: bun tsc --noEmit
        working-directory: frontend
