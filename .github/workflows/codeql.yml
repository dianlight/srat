name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    concurrency:
      group: codeql-actions-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:actions"

  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    concurrency:
      group: codeql-go-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/src/go.mod

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: go
          build-mode: manual

      # The Go module does not compile from a fresh checkout without the
      # gitignored generated file src/config/metadata_constants.go, which is
      # produced by the mise metadata task. Generate it first.
      - name: Generate metadata constants
        working-directory: backend
        run: mise run metadata --version=0.0.0

      # The committed vendor tree is pristine; backend builds require the
      # vendored dependency patches (e.g. hd-idle CheckAtaDevice). Apply
      # them before the traced build, like every other backend build path.
      - name: Apply vendor patches
        working-directory: backend
        run: mise run patch

      # Run the traced build from within the Go module root so the CodeQL
      # extractor can resolve source paths correctly (CGO_ENABLED=0
      # matches the release builds).
      - name: Build (traced by CodeQL)
        working-directory: backend/src
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:go"

  check-frontend-typescript:
    name: Check Frontend TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: codeql-fe-ts-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          experimental: true

      - name: Prepare frontend
        run: mise run //frontend:prepare

      - name: Type check
        run: bun tsc --noEmit
        working-directory: frontend
