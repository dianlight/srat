[tools]
go = "1.26"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:github.com/princjef/gomarkdoc/cmd/gomarkdoc" = "latest"
github-cli = "latest"

[tasks.test]
description = "Run unit tests for all packages"
run = "go test -failfast ./..."

[tasks.coverage]
description = "Run tests and show coverage summary"
run = '''
go test -failfast -coverprofile=coverage.txt ./... -covermode=atomic || true
echo "Summary:"
if [ -f coverage.txt ]; then go tool cover -func=coverage.txt | tail -n 1; fi
'''

[tasks.fmt]
alias = "format"
description = "Run gofmt on the project"
run = "gofmt -s -w ."

[tasks.fmt-check]
description = "Check code format (gofmt)"
run = '''
UNFORMATTED=$(gofmt -l .)
if [ -n "$UNFORMATTED" ]; then
  echo "gofmt needs to be applied to: $UNFORMATTED"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet on the project"
run = "go vet ./..."

[tasks.lint]
description = "Run staticcheck"
run = "staticcheck ./..."

[tasks.ci-lint]
description = "Run CI linting: fmt-check, vet, staticcheck"
depends = ["fmt-check", "vet", "lint"]

[tasks.ci]
description = "Run all CI checks (tidy, mod-download, ci-lint, test)"
depends = ["tidy", "mod-download", "ci-lint", "test"]
run = "echo 'CI: all checks passed'"

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.mod-download]
description = "Download modules (go mod download)"
run = "go mod download"

[tasks.run-example]
description = "Run the example in examples/basic"
dir = "examples/basic"
run = "go run ./"

[tasks.apidoc]
description = "Generate API documentation (APIDOC.md)"
run = "gomarkdoc -o APIDOC.md ."

[tasks.release]
description = "Create and push a standalone bindings/go/vX.Y.Z tag (patch/minor only — a core-paired release is dispatched automatically by release-core.yml instead). On main: stable release. On a branch with open PR: prerelease. No PR: error."
usage = '''
arg "[version_type]" help="Version bump type. Major is not offered here: it changes the module's /vN import path and must be done manually (see docs/development/release-process.md) before any tag is cut." default="patch" {
  choices "minor" "patch"
}
flag "--dry-run" help="Print what would happen without creating or pushing the tag"
'''
run = '''
VERSION_TYPE="${usage_version_type?}"
BRANCH=$(git rev-parse --abbrev-ref HEAD)
SCRIPT_DIR="$(git rev-parse --show-toplevel)/scripts"

if [ "$BRANCH" = "main" ]; then
  MODE="release"
  NEW_TAG=$("$SCRIPT_DIR/next-bindings-go-version.sh" --bump "$VERSION_TYPE")
else
  PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
  if [ -z "$PR_URL" ]; then
    echo "Error: no open PR found for branch '$BRANCH'." >&2
    echo "Create one with: gh pr create --fill" >&2
    exit 1
  fi
  echo "PR: $PR_URL"
  MODE="prerelease"
  CURRENT_TAG=$(git describe --tags --match "bindings/go/v*" --abbrev=0 2>/dev/null || echo "bindings/go/v0.0.0")
  CURRENT_VERSION_TAG=${CURRENT_TAG#bindings/go/}
  if [[ "$CURRENT_VERSION_TAG" == *-* ]]; then
    PRERELEASE_PART=$(echo "$CURRENT_VERSION_TAG" | sed 's/.*-//')
    N=$(echo "$PRERELEASE_PART" | cut -d. -f2)
    NEW_N=$((N + 1))
    NEW_VERSION_TAG=$(echo "$CURRENT_VERSION_TAG" | sed "s/\.[0-9]*$/.$NEW_N/")
  else
    BASE=$("$SCRIPT_DIR/next-bindings-go-version.sh" --bump "$VERSION_TYPE")
    NEW_VERSION_TAG="${BASE#bindings/go/}-beta.0"
  fi
  NEW_TAG="bindings/go/$NEW_VERSION_TAG"
fi

echo "Mode: $MODE | Branch: $BRANCH | Tag: $NEW_TAG"
if [ "${usage_dry_run:-false}" = "true" ]; then
  echo "[dry-run] git tag $NEW_TAG && git push origin $NEW_TAG"
  echo "[dry-run] GOPROXY=proxy.golang.org go list -m github.com/dianlight/smartmontools-sdk/bindings/go/v8@$NEW_TAG"
else
  git tag "$NEW_TAG" && git push origin "$NEW_TAG"
  GOPROXY=proxy.golang.org go list -m "github.com/dianlight/smartmontools-sdk/bindings/go/v8@$NEW_TAG"
fi
'''

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f coverage.txt coverage.out APIDOC.md"
